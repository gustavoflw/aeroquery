[project]
name = "aeroquery"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "airportsdata>=20240913",
    "fast-flights",
    "plotly>=5.24.0",
    "streamlit>=1.38.0",
    "typing-extensions>=4.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
