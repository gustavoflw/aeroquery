[project]
name = "aeroquery"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "airportsdata>=20240913",
    "cachetools>=7.1.7",
    "fast-flights",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "plotly>=5.24.0",
    "streamlit>=1.38.0",
    "typing-extensions>=4.16.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
